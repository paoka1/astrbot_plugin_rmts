name: astrbot_plugin_rmts
display_name: 迷迭香工具箱
short_desc: 明日方舟迷迭香的工具箱：配套人格、跟人走的记忆与日记、群聊上下文与插话、定时提醒、干员资料、天气、搜索、表情、戳一戳
desc: |
  为明日方舟「迷迭香」准备的工具箱，附带依据官方资料编写的人格，启动时自动创建和更新。
  她记得每位博士说过的事，按来源控制谁能看到，每晚写日记并整理记忆；
  群里被叫到时会读最近的群聊，回复时引用并 @ 对方，没人叫她时也会自己决定要不要插话；
  工具：干员生日 / 档案、高德天气、DeepSeek 网页搜索、定时提醒、表情包、戳一戳；
  WebUI 页面可查看画像、日记、交互记录和提醒。
version: 1.2.1
author: paoka1
