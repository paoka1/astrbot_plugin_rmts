<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迷迭香的终端</title>
<style>
  :root {
    --bg: #f7f7f9; --card: #ffffff; --text: #1f2328; --muted: #6b7280;
    --line: #e5e7eb; --accent: #7c6cd8; --accent-soft: #efecfb;
    --warn: #b45309; --warn-soft: #fef3c7; --danger: #b91c1c; --danger-soft: #fee2e2;
    --ok: #15803d; --ok-soft: #dcfce7;
  }
  :root[data-theme="dark"] {
    --bg: #15161a; --card: #1e2026; --text: #e6e6e9; --muted: #9ca3af;
    --line: #2e3138; --accent: #a79bf0; --accent-soft: #2b2840;
    --warn: #fbbf24; --warn-soft: #3a2f12; --danger: #f87171; --danger-soft: #3b1d1d;
    --ok: #4ade80; --ok-soft: #173322;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 14px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 18px; margin: 0; }
  .muted { color: var(--muted); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .status { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  .status .grow { flex: 1; min-width: 220px; }
  .status dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0 0; }
  .status dt { color: var(--muted); white-space: nowrap; }
  .status dd { margin: 0; }
  button {
    font: inherit; border: 1px solid var(--accent); background: var(--accent); color: #fff;
    border-radius: 8px; padding: 6px 16px; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  .tabs { display: flex; gap: 4px; margin: 4px 0 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab {
    background: none; color: var(--muted); border: none; border-bottom: 2px solid transparent;
    border-radius: 0; padding: 6px 12px;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input, select {
    font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; min-width: 0;
  }
  input { flex: 1; min-width: 180px; }
  .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .name { font-weight: 600; }
  .impression { margin: 6px 0 4px; font-style: italic; color: var(--muted); }
  ul.facts { list-style: none; margin: 6px 0 0; padding: 0; }
  ul.facts li { padding: 4px 0; border-top: 1px dashed var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  ul.facts li:first-child { border-top: none; }
  .fid { color: var(--muted); font-variant-numeric: tabular-nums; }
  .ftext { flex: 1; min-width: 160px; word-break: break-word; }
  .chip {
    display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); margin-left: 4px; white-space: nowrap;
  }
  .chip.private { background: var(--danger-soft); color: var(--danger); }
  .chip.self { background: var(--line); color: var(--muted); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.err { background: var(--danger-soft); color: var(--danger); }
  .diary-text { white-space: pre-wrap; margin: 8px 0 0; word-break: break-word; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: normal; }
  td.num { font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  input[type="date"] { flex: 0 1 auto; min-width: 0; }
  .chat { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 12px; align-items: start; }
  .chat .card { margin: 0; }
  .chat-list { padding: 6px; max-height: 75vh; overflow-y: auto; }
  .chat-item {
    display: block; width: 100%; text-align: left; background: none; color: var(--text);
    border: none; border-radius: 8px; padding: 8px 10px;
  }
  .chat-item.active { background: var(--accent-soft); }
  .chat-item .when { float: right; font-size: 12px; color: var(--muted); }
  .chat-item .preview {
    font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-head {
    display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center;
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .chat-head .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chat-body { height: 65vh; overflow-y: auto; padding: 4px 4px 12px; }
  .chat-body .note { text-align: center; font-size: 12px; color: var(--muted); margin: 8px 0; }
  .day { text-align: center; margin: 16px 0 4px; }
  .day span { font-size: 12px; color: var(--muted); background: var(--bg); padding: 2px 10px; border-radius: 999px; }
  .row { display: flex; flex-direction: column; align-items: flex-start; margin-top: 10px; }
  .row.cont { margin-top: 3px; }
  .row.self { align-items: flex-end; }
  .row .meta { font-size: 12px; color: var(--muted); margin-bottom: 2px; display: flex; gap: 6px; align-items: baseline; }
  .row .who { color: var(--text); font-weight: 600; }
  .bubble {
    max-width: 75%; padding: 6px 12px; border-radius: 12px; background: var(--bg);
    border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word;
  }
  .row.self .bubble { background: var(--accent-soft); border-color: transparent; }
  .row.proactive .bubble { border: 1px dashed var(--accent); }
  @media (max-width: 720px) {
    .chat { grid-template-columns: 1fr; }
    .chat-list { max-height: 200px; }
    .bubble { max-width: 90%; }
  }
  .table-wrap { overflow-x: auto; }
  td.text { min-width: 200px; word-break: break-word; }
  .error { color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card status">
    <div class="grow">
      <h1>迷迭香的终端</h1>
      <dl>
        <dt>下次整理</dt><dd id="next-run">—</dd>
        <dt>上次整理</dt><dd id="last-run">—</dd>
      </dl>
    </div>
    <div>
      <button id="consolidate">立即整理</button>
      <div class="muted" id="consolidate-hint" style="margin-top:4px;font-size:12px"></div>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="doctors">博士画像</button>
    <button class="tab" data-tab="groups">群信息</button>
    <button class="tab" data-tab="diaries">日记</button>
    <button class="tab" data-tab="pending">待整理</button>
    <button class="tab" data-tab="history">交互记录</button>
    <button class="tab" data-tab="reminders">定时提醒</button>
  </div>

  <section id="tab-doctors">
    <div class="toolbar"><input id="doctor-filter" placeholder="按名字、QQ 号或内容筛选"></div>
    <div id="doctors"></div>
  </section>
  <section id="tab-groups" hidden><div id="groups"></div></section>
  <section id="tab-diaries" hidden>
    <div class="toolbar">
      <select id="diary-scope"></select>
      <input id="diary-filter" placeholder="按关键词筛选正文、摘要和标签">
    </div>
    <div id="diaries"></div>
  </section>
  <section id="tab-pending" hidden><div class="card" id="pending"></div></section>
  <section id="tab-history" hidden>
    <div class="chat">
      <div class="card chat-list" id="chat-list"></div>
      <div class="card">
        <div class="chat-head">
          <span class="name" id="chat-title"></span>
          <span class="filters muted">
            从 <input type="date" id="history-start"> 到 <input type="date" id="history-end">
            <button id="history-reload">刷新</button>
          </span>
        </div>
        <div class="chat-body" id="history"></div>
      </div>
    </div>
  </section>
  <section id="tab-reminders" hidden><div class="card table-wrap" id="reminders"></div></section>
  <p class="error" id="error" hidden></p>

<script src="/api/plugin/page/bridge-sdk.js"></script>
<script>
(() => {
  const api = window.AstrBotPluginView;
  const $ = (id) => document.getElementById(id);
  let overview = null;
  let diaryEntries = [];
  let pollTimer = null;

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key === "class") node.className = value;
      else node.setAttribute(key, value);
    }
    for (const child of children.flat()) {
      if (child == null || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  function chip(text, cls = "") { return el("span", { class: `chip ${cls}` }, text); }

  function sourceChips(sources) {
    if (!sources.length) return [chip("仅本人", "self")];
    return sources.map((s) => (s === "private" ? chip("私聊", "private") : chip(`群 ${s.replace(/^group:/, "")}`)));
  }

  function lengthChip(item) {
    const text = `${item.length}/${overview.max_length} 字`;
    return item.over_limit ? chip(`${text} 超限`, "warn") : chip(text, "self");
  }

  function factList(facts, withSources) {
    if (!facts.length) return el("p", { class: "muted" }, "（还没有记录）");
    return el("ul", { class: "facts" }, facts.map((f) =>
      el("li", {},
        el("span", { class: "fid" }, `#${f.id}`),
        el("span", { class: "ftext" }, f.text),
        el("span", { class: "muted" }, f.date || "很久以前"),
        withSources ? sourceChips(f.sources) : null)));
  }

  function matches(text, query) { return text.toLowerCase().includes(query.toLowerCase()); }

  function renderDoctors() {
    const query = $("doctor-filter").value.trim();
    const box = $("doctors");
    box.replaceChildren();
    const doctors = overview.doctors.filter((d) => !query || matches(
      [d.name, d.qq, d.impression, ...d.facts.map((f) => f.text)].join("\n"), query));
    if (!doctors.length) { box.append(el("div", { class: "empty" }, "没有符合的博士")); return; }
    for (const d of doctors) {
      box.append(el("div", { class: "card" },
        el("div", { class: "head" },
          el("span", {}, el("span", { class: "name" }, d.name || "（未知名字）"), " ", el("span", { class: "muted" }, d.qq)),
          lengthChip(d)),
        d.impression ? el("p", { class: "impression" }, `印象：${d.impression}`) : null,
        factList(d.facts, true)));
    }
  }

  function renderGroups() {
    const box = $("groups");
    box.replaceChildren();
    if (!overview.groups.length) { box.append(el("div", { class: "empty" }, "还没有群信息")); return; }
    for (const g of overview.groups) {
      box.append(el("div", { class: "card" },
        el("div", { class: "head" }, el("span", { class: "name" }, `群 ${g.id}`), lengthChip(g)),
        factList(g.facts, false)));
    }
  }

  function renderPending() {
    const box = $("pending");
    box.replaceChildren();
    if (!overview.scopes.length) { box.append(el("div", { class: "empty" }, "还没有任何记录")); return; }
    box.append(el("table", {},
      el("thead", {}, el("tr", {}, ["群 / 私聊", "待整理", "其中对她说", "日记篇数", "最近一篇"].map((h) => el("th", {}, h)))),
      el("tbody", {}, overview.scopes.map((s) => el("tr", {},
        el("td", {}, s.label),
        el("td", { class: "num" }, s.pending),
        el("td", { class: "num" }, s.pending_to_her),
        el("td", { class: "num" }, s.diaries),
        el("td", {}, s.latest || "—"))))));
  }

  function renderStatus() {
    const n = overview.nightly;
    $("next-run").textContent = n.next_run;
    const last = $("last-run");
    last.replaceChildren();
    if (!n.last.at) last.append("插件加载后还没有整理过");
    else {
      const failed = Object.keys(n.last.failures || {});
      last.append(`${n.last.at}（${n.last.trigger}）`,
        n.last.error ? chip(`失败：${n.last.error}`, "err")
          : failed.length ? chip(`${failed.length} 处失败，记录已保留：${failed.join("、")}`, "err")
          : chip("成功", "ok"));
    }
    if (n.oversized.length) last.append(chip(`仍超限：${n.oversized.join("、")}`, "warn"));
    $("consolidate").disabled = n.running;
    $("consolidate-hint").textContent = n.running ? "正在整理，完成后自动刷新…" : "";
    if (n.running && !pollTimer) pollTimer = setInterval(refresh, 3000);
    if (!n.running && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function renderDiaryScopes() {
    const select = $("diary-scope");
    const current = select.value;
    const scopes = overview.scopes.filter((s) => s.diaries > 0);
    select.replaceChildren(...scopes.map((s) => el("option", { value: s.scope }, `${s.label}（${s.diaries} 篇）`)));
    if (scopes.some((s) => s.scope === current)) select.value = current;
    loadDiaries();
  }

  async function loadDiaries() {
    const scope = $("diary-scope").value;
    diaryEntries = scope ? await api.apiGet("diaries", { scope }) : [];
    renderDiaries();
  }

  function renderDiaries() {
    const query = $("diary-filter").value.trim();
    const box = $("diaries");
    box.replaceChildren();
    const entries = diaryEntries.filter((d) => !query || matches([d.text, d.summary, ...d.tags].join("\n"), query));
    if (!entries.length) {
      box.append(el("div", { class: "empty" }, diaryEntries.length ? "没有符合的日记" : "还没有日记，整理过一次后就会出现"));
      return;
    }
    for (const d of entries) {
      box.append(el("div", { class: "card" },
        el("div", { class: "head" },
          el("span", {}, el("span", { class: "name" }, d.date), "  ", el("span", { class: "muted" }, d.summary)),
          el("span", {}, d.tags.map((t) => chip(t)))),
        el("p", { class: "diary-text" }, d.text)));
    }
  }

  let chatScope = "";

  function renderChatList(chats) {
    const box = $("chat-list");
    box.replaceChildren();
    if (!chats.length) { box.append(el("div", { class: "empty" }, "还没有交互记录")); return; }
    for (const c of chats) {
      const item = el("button", { class: c.scope === chatScope ? "chat-item active" : "chat-item" },
        el("span", { class: "when" }, c.last_time.slice(5, 16)),
        el("div", { class: "name" }, c.label),
        el("div", { class: "preview" }, c.last_text));
      item.addEventListener("click", () => { chatScope = c.scope; loadHistory(); });
      box.append(item);
    }
  }

  function renderChat(data) {
    const box = $("history");
    box.replaceChildren();
    if (data.truncated) {
      box.append(el("div", { class: "note" }, `只显示最新的 ${data.limit} 条，选择日期范围可查看更早的`));
    }
    if (!data.entries.length) { box.append(el("div", { class: "empty" }, "这段时间没有交互记录")); return; }
    let prev = null;
    for (const m of [...data.entries].reverse()) {
      const day = m.time.slice(0, 10);
      const at = Date.parse(m.time.replace(" ", "T"));
      if (!prev || prev.day !== day) box.append(el("div", { class: "day" }, el("span", {}, day)));
      // 同一个人几分钟内连着说的话，只在第一条上面写名字和时间
      const cont = prev && prev.day === day && prev.who === `${m.is_self}/${m.qq}/${m.proactive}` && at - prev.at < 5 * 60000;
      const cls = ["row", m.is_self ? "self" : "", m.proactive ? "proactive" : "", cont ? "cont" : ""].join(" ");
      box.append(el("div", { class: cls },
        cont ? null : el("div", { class: "meta" },
          m.is_self ? null : el("span", { class: "who" }, m.name || "（未知）"),
          m.is_self ? null : el("span", {}, m.qq),
          el("span", {}, m.time.slice(11, 16)),
          m.proactive ? chip("主动发出", "warn") : null),
        el("div", { class: "bubble", title: m.time }, m.text)));
      prev = { day, at, who: `${m.is_self}/${m.qq}/${m.proactive}` };
    }
    box.scrollTop = box.scrollHeight;
  }

  async function loadHistory() {
    try {
      const query = { start: $("history-start").value, end: $("history-end").value };
      let data = await api.apiGet("history", { ...query, scope: chatScope });
      if (!data.scopes.some((c) => c.scope === chatScope) && data.scopes.length) {
        chatScope = data.scopes[0].scope;
        data = await api.apiGet("history", { ...query, scope: chatScope });
      }
      renderChatList(data.scopes);
      const current = data.scopes.find((c) => c.scope === chatScope);
      $("chat-title").textContent = current ? current.label : "";
      renderChat(data);
    } catch (e) {
      $("history").replaceChildren(el("div", { class: "error" }, `加载失败：${e.message || e}`));
    }
  }

  async function loadReminders() {
    const box = $("reminders");
    try {
      const items = await api.apiGet("reminders");
      box.replaceChildren();
      if (!items.length) { box.append(el("div", { class: "empty" }, "现在没有定时提醒")); return; }
      box.append(el("table", {},
        el("thead", {}, el("tr", {}, ["#", "群 / 私聊", "博士", "下次", "重复", "内容", "到点", "设于"].map((h) => el("th", {}, h)))),
        el("tbody", {}, items.map((r) => el("tr", {},
          el("td", { class: "num" }, r.id),
          el("td", {}, r.label),
          el("td", {}, `${r.name}(${r.qq})`),
          el("td", { class: "num" }, r.at),
          el("td", {}, r.repeat_label),
          el("td", { class: "text" }, r.text),
          el("td", {}, r.weather ? `组织语言，附${r.weather}天气` : r.compose ? "组织语言" : "原样发送"),
          el("td", { class: "num" }, r.created || "—"))))));
    } catch (e) {
      box.replaceChildren(el("div", { class: "error" }, `加载失败：${e.message || e}`));
    }
  }

  async function refresh() {
    try {
      overview = await api.apiGet("overview");
      $("error").hidden = true;
      renderStatus();
      renderDoctors();
      renderGroups();
      renderPending();
      renderDiaryScopes();
    } catch (e) {
      $("error").hidden = false;
      $("error").textContent = `加载失败：${e.message || e}`;
    }
  }

  document.querySelectorAll(".tab").forEach((tab) => tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === tab));
    for (const name of ["doctors", "groups", "diaries", "pending", "history", "reminders"]) {
      $(`tab-${name}`).hidden = name !== tab.dataset.tab;
    }
    if (tab.dataset.tab === "history") loadHistory();
    if (tab.dataset.tab === "reminders") loadReminders();
  }));
  for (const id of ["history-start", "history-end"]) $(id).addEventListener("change", loadHistory);
  $("history-reload").addEventListener("click", loadHistory);
  $("doctor-filter").addEventListener("input", renderDoctors);
  $("diary-filter").addEventListener("input", renderDiaries);
  $("diary-scope").addEventListener("change", loadDiaries);
  $("consolidate").addEventListener("click", async () => {
    if (!confirm("现在就为每个有新记录的群和私聊写日记、整理记忆吗？会调用模型，可能需要一两分钟。")) return;
    $("consolidate").disabled = true;
    try {
      const result = await api.apiPost("consolidate", {});
      $("consolidate-hint").textContent = result.message;
    } catch (e) {
      $("consolidate-hint").textContent = `启动失败：${e.message || e}`;
    }
    refresh();
  });

  api.ready().then(refresh);
})();
</script>
</body>
</html>
